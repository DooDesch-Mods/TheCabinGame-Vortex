# Copy to the gameplay repo's .github/workflows only after adapting its asset name.
# Assumes that repo's build pipeline attached a tested ZIP to the published release.
name: Update gameplay mod on Nexus
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: nexus-gameplay-${{ github.repository }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Verify target and resolve release version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          FILE_GROUP_ID: ${{ vars.NEXUS_FILE_GROUP_ID }}
          LIVE_TESTED: ${{ vars.NEXUS_LIVE_TESTED }}
          NEXUS_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Invalid release tag'; exit 1; }
          [[ "$FILE_GROUP_ID" =~ ^[0-9]+$ ]] || { echo '::error::Missing/invalid gameplay Nexus file-group ID'; exit 1; }
          [[ "$LIVE_TESTED" == true ]] || { echo '::error::Gameplay live acceptance is pending'; exit 1; }
          [[ -n "$NEXUS_KEY" ]] || { echo '::error::Nexus secret is unavailable'; exit 1; }
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Download the accepted release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "CabinRejoin-${VERSION}.zip" --dir dist
      - uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        id: nexus
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_GROUP_ID }}
          filename: dist/CabinRejoin-${{ steps.release.outputs.version }}.zip
          version: ${{ steps.release.outputs.version }}
          category: main
          primary_mod_manager_download: true
          allow_mod_manager_download: true
          archive_existing_version: true
          update_mod_version: true
      - name: Confirm upload acknowledgement
        env:
          VERSION_ID: ${{ steps.nexus.outputs.version_id }}
        run: |
          set -euo pipefail
          [[ -n "$VERSION_ID" ]] || { echo '::error::No uploaded Nexus version ID returned'; exit 1; }
          echo "Nexus acknowledged uploaded version ID: $VERSION_ID" >> "$GITHUB_STEP_SUMMARY"
