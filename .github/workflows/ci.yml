name: Check and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Installer and deployment checks
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          node --test tests/extension.test.js
      - name: Build the extension
        id: package
        env:
          NEXUS_GAME_DOMAIN: ${{ vars.NEXUS_GAME_DOMAIN }}
        run: |
          if ($env:NEXUS_GAME_DOMAIN) {
            python tools/build-extension.py --nexus-domain $env:NEXUS_GAME_DOMAIN
          } else {
            Write-Output 'info: Nexus domain pending; building local candidate'
            python tools/build-extension.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packageVersion = (Get-Content extension/info.json -Raw | ConvertFrom-Json).version
          $packageSuffix = if ($env:NEXUS_GAME_DOMAIN) { '' } else { '-local-candidate' }
          $packageBase = "dist/TheCabinGame-Vortex-$packageVersion$packageSuffix"
          "asset=$packageBase.zip" >> $env:GITHUB_OUTPUT
          "receipt=$packageBase.json" >> $env:GITHUB_OUTPUT
      - name: Verify gameplay package builder and document links
        run: python tools/verify-preparation.py
      - name: Verify publication guards without an upload
        run: python tests/test_release.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: vortex-package
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.receipt }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: check-evidence
          path: evidence/
          if-no-files-found: warn
