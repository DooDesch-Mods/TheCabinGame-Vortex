name: Read Nexus game metadata
on:
  workflow_dispatch:
    inputs:
      mod_file_id:
        description: Public Nexus file ID to inspect without changing it
        type: string
        default: '8127426'
      check_extension:
        description: Read extension page category and current Main Files
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Read approved and pending game records
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          MOD_FILE_ID: ${{ inputs.mod_file_id }}
          CHECK_EXTENSION: ${{ inputs.check_extension }}
        run: |
          args=()
          if [ "$CHECK_EXTENSION" = "true" ]; then args+=(--check-extension); fi
          python tools/check-nexus-game.py --mod-file-id "$MOD_FILE_ID" --output nexus-game.json "${args[@]}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nexus-game-metadata
          path: nexus-game.json
          if-no-files-found: error
